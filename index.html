<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2300008B%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>S</text></svg>">
<script src="config.js"></script>
<title>Sathena Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#191919; --muted:#5F6B85; --line:#E1E4EC; --line-strong:#C3C9D8;
  --brand:#00008B; --brand-ink:#FFFFFF; --brand-muted:#9DA3D9; --brand-active:#1A1AA6;
  --accent:#0539F5; --accent-ink:#FFFFFF; --accent-soft:#E6EBFE;
  --ok:#00935F; --ok-soft:#DDF5EB; --warn:#B7791F; --warn-soft:#FBEFD6; --bad:#D03A3A; --bad-soft:#FBE1E1;
  --shadow:0 1px 2px rgba(0,0,139,.06),0 8px 24px rgba(0,0,139,.08);
  --radius:10px;
  --c-verlof:#00935F;
  --tint:12%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1120; --surface:#181B2E; --surface-2:#1F2338; --ink:#ECEEF6; --muted:#9AA3C2; --line:#2B3050; --line-strong:#3D4470;
    --brand:#060650; --brand-ink:#FFFFFF; --brand-muted:#8A90D0; --brand-active:#15157A;
    --accent:#5A7CFF; --accent-ink:#FFFFFF; --accent-soft:#1E2A5E;
    --ok:#4BCB94; --ok-soft:#153426; --warn:#E0A63C; --warn-soft:#3A2D12; --bad:#F26D6D; --bad-soft:#3E1B1B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --c-verlof:#4BCB94;
    --tint:24%;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B2E; --surface-2:#1F2338; --ink:#ECEEF6; --muted:#9AA3C2; --line:#2B3050; --line-strong:#3D4470;
  --brand:#060650; --brand-ink:#FFFFFF; --brand-muted:#8A90D0; --brand-active:#15157A;
  --accent:#5A7CFF; --accent-ink:#FFFFFF; --accent-soft:#1E2A5E;
  --ok:#4BCB94; --ok-soft:#153426; --warn:#E0A63C; --warn-soft:#3A2D12; --bad:#F26D6D; --bad-soft:#3E1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --c-verlof:#4BCB94;
  --tint:24%;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3,.display{font-family:"Inter Tight","Inter",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:22px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.logo{display:block;height:auto}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.login-head{padding:28px 28px 8px;display:grid;justify-items:center;gap:6px;text-align:center}
.login-head .logo{width:220px}
.login-head .sub{color:var(--muted);font-size:13px}
.login-body{padding:18px 28px 26px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea.input{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.93)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.icon{padding:5px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.hint code{font-family:ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.error{color:var(--bad);font-size:13px;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding:20px 12px 14px;gap:4px;position:sticky;top:0;height:100vh}
.rail .brand{padding:2px 10px 18px}
.rail .brand .logo{width:150px;filter:brightness(0) invert(1)}
.rail .brand .sub{color:var(--brand-muted);font-size:12px;margin-top:6px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;color:var(--brand-ink);text-align:left;width:100%;font-weight:500}
.nav-btn:hover{background:var(--brand-active)}
.nav-btn.active{background:var(--surface);color:var(--brand);font-weight:600}
.nav-btn .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.nav-btn.active .badge{background:var(--accent)}
.rail .spacer{flex:1}
.rail .who{padding:10px 12px;border-top:1px solid var(--brand-active);font-size:13px;color:var(--brand-muted)}
.rail .who b{color:var(--brand-ink);display:block}
.rail .sync{font-size:11.5px;color:var(--brand-muted);padding:6px 12px 0;display:flex;align-items:center;gap:6px}
.rail .sync i{width:7px;height:7px;border-radius:50%;background:#4BCB94;display:inline-block}
.rail .sync.local i{background:var(--warn)}
.main{padding:22px 26px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h2{font-size:24px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.weeknav .label{padding:0 10px;font-weight:600;min-width:200px;text-align:center}
.weeknav input[type=date]{border:0;background:transparent;padding:4px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:14px}

/* ---------- summary strip ---------- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;gap:5px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day .dn{display:flex;justify-content:space-between;align-items:baseline}
.day .dn b{font-family:"Inter Tight",sans-serif;font-size:17px;text-transform:capitalize}
.day .dn span{color:var(--muted);font-size:13px}
.day .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.day .kv b{color:var(--ink);font-weight:600}
.delta{display:inline-flex;align-items:center;justify-content:center;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:18px;border-radius:6px;padding:1px 8px;line-height:1.3}
.delta.ok{background:var(--ok-soft);color:var(--ok)} .delta.warn{background:var(--warn-soft);color:var(--warn)} .delta.bad{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend .sw{display:inline-flex;align-items:center;gap:5px}
.legend .sw i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- grid ---------- */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:880px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:0;text-align:left;vertical-align:middle}
table.grid thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted)}
table.grid thead th.today{color:var(--accent)}
table.grid th.name,table.grid td.name{position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 12px;min-width:220px;border-right:1px solid var(--line)}
table.grid thead th.name{z-index:3;background:var(--surface-2)}
table.grid td.name .n{font-weight:600;display:flex;align-items:center;gap:6px}
table.grid td.name .s{font-size:12px;color:var(--muted)}
table.grid tr.group td{background:var(--surface-2);padding:6px 12px;font-family:"Inter Tight",sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
table.grid td.cell{padding:4px;width:12%;min-width:98px}
table.grid td.cell.na{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 60%,transparent) 6px 7px)}
.chip{display:flex;align-items:center;justify-content:center;height:34px;border-radius:7px;font-weight:600;font-size:13px;border:1px solid transparent;width:100%;background:transparent;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.empty{color:transparent}
.chip.clickable:hover{border-color:var(--line-strong);background:var(--surface-2);color:var(--muted)}
.chip.clickable.empty:hover::after{content:"+";color:var(--muted);font-size:16px}
.chip.t{color:var(--tc);background:color-mix(in srgb,var(--tc) var(--tint),transparent);border-color:color-mix(in srgb,var(--tc) 35%,transparent)}
.chip.avail{color:var(--muted);border:1px dashed var(--line-strong);font-weight:500}
.chip.avail.clickable:hover{color:var(--ink)}
.chip.verlof{color:var(--c-verlof);background:color-mix(in srgb,var(--c-verlof) var(--tint),transparent);border-color:color-mix(in srgb,var(--c-verlof) 35%,transparent);cursor:default}
.chip .bus{margin-left:6px;font-size:11px;font-weight:700;opacity:.85;border-left:1px solid currentColor;padding-left:6px}
.flex-mark{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}

/* ---------- popover ---------- */
.popover{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:236px;display:grid;gap:2px}
.popover .ph{padding:6px 10px 4px;font-size:12px;color:var(--muted)}
.popover .ph b{color:var(--ink);display:block;font-size:14px}
.popover .sec{padding:6px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.popover button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:7px;text-align:left;font-weight:500}
.popover button:hover{background:var(--surface-2)}
.popover button i{width:12px;height:12px;border-radius:3px;background:var(--tc);flex:none}
.popover button.current{background:var(--accent-soft);color:var(--accent);font-weight:600}
.popover hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ---------- cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.panel + .panel{margin-top:14px}
.panel h3{margin-bottom:10px;display:flex;align-items:center;gap:10px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:14px;align-items:start}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.list td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list .input,table.list select.input{padding:6px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.open{background:var(--warn-soft);color:var(--warn)} .pill.goedgekeurd{background:var(--ok-soft);color:var(--ok)} .pill.afgewezen{background:var(--bad-soft);color:var(--bad)}
.pill.final{background:var(--ok-soft);color:var(--ok)} .pill.concept{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
pre.export{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;margin:0;max-height:420px;overflow:auto}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leave-card{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.leave-card .who{font-weight:600}
.leave-card .period{font-family:"Inter Tight",sans-serif;font-size:17px;font-weight:600}
.leave-card .conf{font-size:13px;color:var(--warn);font-weight:600}
.empty-state{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.needs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.needs .field input{text-align:center;font-family:"Inter Tight",sans-serif;font-size:20px;font-weight:600;padding:6px}
.swatches{display:flex;gap:4px}
.swatches button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0}
.swatches button.sel{border-color:var(--ink)}
.avail{display:flex;gap:3px}
.avail label{display:grid;place-items:center;width:28px;height:26px;border:1px solid var(--line-strong);border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.avail input{position:absolute;opacity:0;width:0;height:0}
.avail label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}

/* ---------- employee view ---------- */
.mydays{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.myday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px;min-height:118px}
.myday.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.myday .dn b{font-family:"Inter Tight",sans-serif;font-size:18px;text-transform:capitalize;display:block}
.myday .dn span{font-size:13px;color:var(--muted)}
.myday .what{font-weight:600;font-size:15px}
.myday .what.t{color:var(--tc)}
.myday .what.none{color:var(--muted);font-weight:500}
.myday .busline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.myday .busline.pending{color:var(--muted);font-weight:500}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
  .rail .brand{padding:0 10px 0 0}
  .rail .brand .logo{width:110px}
  .rail .brand .sub{display:none}
  .rail .spacer,.rail .who,.rail .sync{display:none}
  .nav-btn{width:auto;padding:7px 10px}
  .main{padding:16px 14px 60px}
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .needs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .weeknav .label{min-width:0}
}
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>

/* ============================== Date helpers ============================== */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const wdIndex = d => (d.getDay()+6)%7;
const monday = d => addDays(d,-wdIndex(d));
function isoWeek(d){
  const x = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day = x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return {year:x.getUTCFullYear(), week:Math.ceil((((x-y0)/86400000)+1)/7)};
}
const weekId = d => { const w=isoWeek(d); return `${w.year}-W${pad(w.week)}`; };
const fmtLong = d => `${WEEKDAYS[wdIndex(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
const fmtNL = s => { const d=parseISO(s); return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`; };
const todayISO = () => iso(new Date());
function daysBetween(a,b){ const out=[]; let d=parseISO(a); const e=parseISO(b); while(d<=e){ out.push(iso(d)); d=addDays(d,1);} return out; }
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

   1. Supabase (SATHENA_CONFIG.supabaseUrl + supabaseAnonKey) — tabel "docs"(coll,id,data)
   2. Artifact db (claude.use('db'))
   3. localStorage (alleen deze browser) */
let backend = 'local', db = null, sb = null, downloads = null, loaded = false;

function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); S={settings:o.settings||null,weeks:o.weeks||{},leave:o.leave||{},dayplans:o.dayplans||{}}; } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function loadSession(){ try{ session = JSON.parse(localStorage.getItem('sathena.session')||'null'); }catch(e){ session=null } }
function saveSession(){ try{ session? localStorage.setItem('sathena.session',JSON.stringify(session)) : localStorage.removeItem('sathena.session'); }catch(e){} }

function normalizeSettings(s){
  if(!s) return null;
  s.buses = (s.buses||[]).map(b=>({id:b.id, name:(b.plate&&b.plate.trim()) || b.name || ''}));
  s.employees = (s.employees||[]).map(e=>({fixed:true,avail:[1,1,1,1,1,0,0],counts:true,skill:'',phone:'',...e}));
  s.types = s.types||[]; s.needs = s.needs||[0,0,0,0,0,0,0];
  if(!s.plannerPwHash && !s.plannerPassword) s.plannerPassword = DEFAULT_PLANNER_PASSWORD;
  if(!s.employeePassword) s.employeePassword = DEFAULT_EMPLOYEE_PASSWORD;
  if(!s.company) s.company='Sathena';
  return s;
}
/* Wachtwoorden worden als SHA-256-hash opgeslagen, nooit als tekst. */
async function hashPw(scope,pw){
  const buf = new TextEncoder().encode('sathena|'+scope+'|'+pw);
  const h = await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const settings = () => S.settings || DEFAULT_SETTINGS;
const empById = id => settings().employees.find(e=>e.id===id);
const typeById = id => settings().types.find(t=>t.id===id);
const busById = id => settings().buses.find(b=>b.id===id);
const clone = o => JSON.parse(JSON.stringify(o));

async function writeDoc(coll,id,data){
  data = clone(data);
  if(coll==='settings') S.settings=normalizeSettings(data); else S[coll][id]=data;
  render();
  try{
    if(backend==='supabase'){ const {error} = await sb.from('docs').upsert({coll,id,data,updated_at:new Date().toISOString()}); if(error) throw error; }
    else if(backend==='artifact'){ await db.doc(`${coll}/${id}`).set(data); }
    else saveLocal();
  }catch(e){ toast('Opslaan mislukt: '+(e.message||e.code||'onbekende fout')); }
}
async function deleteDoc(coll,id){
  delete S[coll][id]; render();
  try{
    if(backend==='supabase'){ const {error} = await sb.from('docs').delete().match({coll,id}); if(error) throw error; }
    else if(backend==='artifact'){ await db.doc(`${coll}/${id}`).delete(); }
    else saveLocal();
  }catch(e){ toast('Verwijderen mislukt'); }
}
function applyRow(row){ if(row.coll==='settings') S.settings=normalizeSettings(row.data); else if(S[row.coll]) S[row.coll][row.id]=row.data; }

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

async function connect(){
  loadLocal(); loadSession(); render();
  if(CFG.supabaseUrl && CFG.supabaseAnonKey){
    try{
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      const {data,error} = await sb.from('docs').select('coll,id,data');
      if(error) throw error;
      backend='supabase'; S={settings:null,weeks:{},leave:{},dayplans:{}};
      (data||[]).forEach(applyRow); loaded=true; render();
      sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
        if(p.eventType==='DELETE'){ const o=p.old||{}; if(o.coll==='settings') S.settings=null; else if(S[o.coll]) delete S[o.coll][o.id]; }
        else applyRow(p.new);
        render();
      }).subscribe();
    }catch(e){ backend='local'; loaded=true; toast('Supabase niet bereikbaar, werkt nu lokaal'); render(); }
  } else if(window.claude && typeof window.claude.use==='function'){
    try{ db = await window.claude.use('db'); }catch(e){ db=null; }
    if(db){
      backend='artifact'; S={settings:null,weeks:{},leave:{},dayplans:{}};
      const err = e => { if(e && e.code!=='unavailable') toast('Verbinding met opslag verbroken'); };
      db.doc('settings/main').onSnapshot(s=>{ S.settings = s.exists ? normalizeSettings(s.data()) : null; loaded=true; render(); }, err);
      for(const coll of ['weeks','leave','dayplans']){
        db.collection(coll).onSnapshot(q=>{ const m={}; q.docs.forEach(d=>m[d.id]=d.data()); S[coll]=m; render(); }, err);
      }
    } else { loaded=true; }
    try{ downloads = await window.claude.use('downloads'); }catch(e){ downloads=null; }
  } else { loaded=true; if(S.settings) S.settings=normalizeSettings(S.settings); }
  render();
}

/* ============================== Domain logic ============================== */
function weekDoc(dateISO){ return S.weeks[weekId(parseISO(dateISO))] || null; }
function shiftsFor(dateISO){ const w=weekDoc(dateISO); return (w && w.shifts && w.shifts[dateISO]) || {}; }
function getShift(empId,dateISO){ return shiftsFor(dateISO)[empId] || null; }
function weekAvail(empId,dateISO){ const w=weekDoc(dateISO); return !!(w && w.avail && w.avail[dateISO] && w.avail[dateISO][empId]); }
async function mutateWeek(dateISO,fn){
  const wid = weekId(parseISO(dateISO));
  const w = clone(S.weeks[wid] || {id:wid,shifts:{},avail:{}});
  w.shifts = w.shifts||{}; w.avail = w.avail||{};
  fn(w);
  for(const k of ['shifts','avail']) for(const d of Object.keys(w[k])) if(!Object.keys(w[k][d]).length) delete w[k][d];
  w.updatedAt = new Date().toISOString();
  await writeDoc('weeks',wid,w);
}
const setShift = (empId,dateISO,typeId) => mutateWeek(dateISO,w=>{
  w.shifts[dateISO]=w.shifts[dateISO]||{}; w.avail[dateISO]=w.avail[dateISO]||{};
  if(typeId){ w.shifts[dateISO][empId]=typeId; w.avail[dateISO][empId]=true; } else delete w.shifts[dateISO][empId];
});
const setAvail = (empId,dateISO,on) => mutateWeek(dateISO,w=>{
  w.avail[dateISO]=w.avail[dateISO]||{}; w.shifts[dateISO]=w.shifts[dateISO]||{};
  if(on) w.avail[dateISO][empId]=true; else { delete w.avail[dateISO][empId]; delete w.shifts[dateISO][empId]; }
});
function leaveOn(empId,dateISO){ return Object.values(S.leave).find(l=>l.empId===empId && l.status==='goedgekeurd' && l.from<=dateISO && dateISO<=l.to) || null; }
function isAvailable(e,dateISO){
  if(leaveOn(e.id,dateISO)) return false;
  if(getShift(e.id,dateISO)) return true;
  return e.fixed ? !!e.avail[wdIndex(parseISO(dateISO))] : weekAvail(e.id,dateISO);
}
function availableOn(dateISO){ return settings().employees.filter(e=>e.counts && isAvailable(e,dateISO)); }
function plannedOn(dateISO){ return Object.entries(shiftsFor(dateISO)).filter(([id])=>!leaveOn(id,dateISO) && empById(id)); }
function needOn(dateISO){ return Number(settings().needs[wdIndex(parseISO(dateISO))]||0); }
function deltaClass(n){ return n>=0 ? (n===0?'warn':'ok') : 'bad'; }
function openLeaveCount(){ return Object.values(S.leave).filter(l=>l.status==='open').length; }
function conflictsFor(l){ return daysBetween(l.from,l.to).filter(d=>getShift(l.empId,d)).length; }

async function decideLeave(id,status){
  const l = clone(S.leave[id]); if(!l) return;
  l.status=status; l.decidedAt=new Date().toISOString(); l.decidedBy='planner';
  await writeDoc('leave',id,l);
  if(status==='goedgekeurd'){
    const byWeek = {};
    for(const d of daysBetween(l.from,l.to)){ if(getShift(l.empId,d)) (byWeek[weekId(parseISO(d))] = byWeek[weekId(parseISO(d))]||[]).push(d); }
    for(const days of Object.values(byWeek)) await mutateWeek(days[0], w=>{ days.forEach(d=>{ if(w.shifts[d]) delete w.shifts[d][l.empId]; }); });
  }
  toast(status==='goedgekeurd'?'Verlof goedgekeurd':'Verlof afgewezen');
}

function dayplanFor(dateISO){ return S.dayplans[dateISO] || null; }
function rowsFromRoster(dateISO){
  const order = settings().employees.map(e=>e.id);
  return plannedOn(dateISO).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).map(([empId,typeId])=>({empId,typeId,busId:'',note:''}));
}
/* Elke opgeslagen dagplanning bewaart de namen zelf, zodat het archief klopt
   ook als een medewerker later wordt verwijderd of hernoemd. */
async function savePlan(dateISO,plan){
  plan.date=dateISO; plan.updatedAt=new Date().toISOString();
  plan.rows.forEach(r=>{ if(r.empId){ const e=empById(r.empId); if(e) r.name=e.name; } const b=busById(r.busId); if(b) r.busName=b.name; else if(!r.busId) delete r.busName; });
  await writeDoc('dayplans',dateISO,plan);
}
function rowName(r){ if(r.adhoc) return r.name||'(naam ontbreekt)'; const e=empById(r.empId); return e?e.name:(r.name||'?'); }
function rowBus(r){ const b=busById(r.busId); return b?b.name:(r.busId&&r.busName?r.busName:''); }
async function updatePlan(mut){
  const p = clone(dayplanFor(V.planDate) || {date:V.planDate,final:false,rows:rowsFromRoster(V.planDate)});
  mut(p); await savePlan(V.planDate,p);
}
function exportText(dateISO){
  const p = dayplanFor(dateISO); const d=parseISO(dateISO); const st=settings();
  const lines = [`*Dagplanning ${fmtLong(d)}*`, st.company, ''];
  const rows = p ? p.rows : [];
  const groupsOrder = [...st.types.map(t=>t.id),''];
  let total=0, buses=new Set();
  for(const tid of groupsOrder){
    const rs = rows.filter(r=>(r.typeId||'')===tid); if(!rs.length) continue;
    lines.push(`*${tid ? (typeById(tid)||{}).name || tid : 'Overig'}*`);
    for(const r of rs){
      const bus=rowBus(r);
      let line = `${bus || 'Geen bus'} · ${rowName(r)}`;
      if(r.note) line += ` — ${r.note}`;
      lines.push(line); total++; if(bus) buses.add(bus);
    }
    lines.push('');
  }
  lines.push(`Totaal: ${total} medewerkers, ${buses.size} bussen`);
  if(!p || !p.final) lines.push('(concept — nog niet definitief)');
  return lines.join('\n');
}

async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Gekopieerd — plak in WhatsApp'); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Gekopieerd'); }catch(_){ toast('Kopiëren niet gelukt'); } ta.remove(); } }

async function checkPassword(who,pw){
  const st=settings();
  if(who===PLANNER_USER){
    if(st.plannerPwHash) return (await hashPw('planner',pw))===st.plannerPwHash;
    return pw===st.plannerPassword;

  return `<div class="popover" style="left:${x}px;top:${Math.max(8,y)}px" id="menu">
    <div class="ph">${fmtLong(parseISO(m.date))}<b>${esc(e.name)}</b></div>

    ${st.types.map(t=>`<button data-pick="${t.id}" class="${cur===t.id?'current':''}" style="${typeStyle(t)}"><i></i>${esc(t.name)}</button>`).join('')}
    <hr><button data-pick=""><i style="background:transparent;border:1px solid var(--line-strong)"></i>Dienst leegmaken</button>
  </div>`;
}

/* ---------- Dagplanning (planner) ---------- */
function renderDagplanning(){
  const d = V.planDate; const dd=parseISO(d); const plan = dayplanFor(d); const st=settings();
  const rows = plan ? plan.rows : rowsFromRoster(d);

  const adhocCount = rows.filter(r=>r.adhoc).length;
  const usedBus = {}; rows.forEach(r=>{ if(r.busId) usedBus[r.busId]=(usedBus[r.busId]||0)+1; });
  const dup = Object.values(usedBus).some(n=>n>1);
  const text = plan ? exportText(d) : null;
  const archive = Object.values(S.dayplans).sort((a,b)=>a.date<b.date?1:-1);
  return `<div class="topbar"><div><div class="eyebrow">Definitief per dag</div><h2>Dagplanning</h2></div>

      <span class="label" style="text-transform:capitalize">${fmtLong(dd)}</span>

      <button class="btn sm ghost" data-day="0">Vandaag</button>

  <div class="two">
    <div class="panel">
      <h3>Bussen toewijzen <span class="pill ${plan&&plan.final?'final':'concept'}">${plan?(plan.final?'Definitief':'Concept'):'Nog niet opgeslagen'}</span></h3>
      <div class="row small muted" style="margin-bottom:10px">
        <span>${plannedOn(d).length} ingepland in het weekrooster · ${availableOn(d).length} beschikbaar · behoefte ${needOn(d)}</span>
      </div>
      ${dup?`<div class="hint" style="color:var(--warn);margin-bottom:10px">Let op: een bus is meer dan één keer toegewezen.</div>`:''}
      ${notPlanned?`<div class="hint" style="margin-bottom:10px">${notPlanned} medewerker(s) in deze dagplanning staan niet in het weekrooster voor deze dag.</div>`:''}
      ${adhocCount?`<div class="small muted" style="margin-bottom:8px">${adhocCount} ad-hoc rij${adhocCount>1?'en':''} (meerijders of tijdelijke krachten, niet in het weekrooster).</div>`:''}
      <div style="overflow-x:auto"><table class="list">
        <thead><tr><th>Medewerker</th><th>Dienst</th><th>Bus</th><th>Opmerking</th><th></th></tr></thead>
        <tbody>${rows.length? rows.map((r,i)=>`<tr>
          <td>${r.adhoc
            ? `<div class="row" style="flex-wrap:nowrap"><span class="tag" title="Ad hoc: staat niet in het weekrooster">AD HOC</span><input class="input" data-prow="${i}" data-pf="name" value="${esc(r.name||'')}" placeholder="Naam, bijv. Jan (meerijder)" style="min-width:170px"></div>`
            : `<select class="input" data-prow="${i}" data-pf="empId">${st.employees.map(e=>`<option value="${e.id}" ${e.id===r.empId?'selected':''}>${esc(e.name)}</option>`).join('')}${r.empId&&!empById(r.empId)?`<option value="${esc(r.empId)}" selected>${esc(r.name||r.empId)} (verwijderd)</option>`:''}<option value="__adhoc">Ad hoc / extern…</option></select>`}</td>
          <td><select class="input" data-prow="${i}" data-pf="typeId"><option value="">—</option>${st.types.map(t=>`<option value="${t.id}" ${t.id===r.typeId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></td>
          <td><select class="input" data-prow="${i}" data-pf="busId" style="${usedBus[r.busId]>1?'border-color:var(--warn)':''}"><option value="">Geen bus</option>${st.buses.map(b=>`<option value="${b.id}" ${b.id===r.busId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td>
          <td><input class="input" data-prow="${i}" data-pf="note" value="${esc(r.note||'')}" placeholder="bijv. samen met bijrijder"></td>
          <td><button class="btn sm ghost" data-prow-del="${i}" aria-label="Rij verwijderen">✕</button></td>

      </table></div>
      <div class="row" style="margin-top:12px">
        <button class="btn sm" data-plan-add ${st.employees.length?'':'disabled'}>+ Medewerker</button>
        <button class="btn sm" data-plan-adhoc>+ Ad hoc / extern</button>
        <button class="btn sm" data-plan-sync title="Voegt medewerkers toe die wel in het weekrooster staan maar hier nog niet">Aanvullen uit weekrooster</button>
        <span style="flex:1"></span>
        ${plan&&plan.final ? `<button class="btn sm" data-plan-final="0">Terug naar concept</button>` : `<button class="btn ok" data-plan-final="1">Markeer definitief</button>`}

        <td style="text-transform:capitalize;font-weight:600">${fmtLong(pd)}</td>
        <td><span class="pill ${p.final?'final':'concept'}">${p.final?'Definitief':'Concept'}</span></td>
        <td>${p.rows.length}${p.rows.some(r=>r.adhoc)?` <span class="muted small">(${p.rows.filter(r=>r.adhoc).length} ad hoc)</span>`:''}</td>
        <td>${buses.size}</td>
        <td class="muted small">${p.updatedAt?fmtNL(p.updatedAt.slice(0,10)):''}</td>
        <td><button class="btn sm ghost" data-plan-open="${p.date}">Openen</button></td>

/* ---------- Verlof (planner) ---------- */
function renderVerlof(){
  const all = Object.values(S.leave).sort((a,b)=>(a.from<b.from?1:-1));
  const open = all.filter(l=>l.status==='open').sort((a,b)=>a.from<b.from?-1:1); const done = all.filter(l=>l.status!=='open');
  const list = V.leaveTab==='open'?open:done;
  return `<div class="topbar"><div><div class="eyebrow">Aanvragen van medewerkers</div><h2>Verlofaanvragen</h2></div>
    <div class="toolbar"><div class="weeknav">
      <button class="btn sm ${V.leaveTab==='open'?'primary':'ghost'}" data-ltab="open">Open (${open.length})</button>
      <button class="btn sm ${V.leaveTab==='done'?'primary':'ghost'}" data-ltab="done">Afgehandeld (${done.length})</button>
    </div></div></div>

}
function leaveDays(l){ return daysBetween(l.from,l.to).length; }
function renderLeaveCard(l,planner){
  const e=empById(l.empId); const conf = l.status==='open' ? conflictsFor(l) : 0;

      <div class="small muted">Aangevraagd ${l.createdAt?fmtNL(l.createdAt.slice(0,10)):''}${l.decidedAt?` · beslist ${fmtNL(l.decidedAt.slice(0,10))}`:''}</div>

/* ---------- Medewerker: mijn rooster ---------- */
function renderMijn(){
  const e = empById(session.empId); if(!e) return `<div class="empty-state">Je account is niet meer gevonden. Log opnieuw in.</div>`;
  const days = weekDays(V.myWeek); const t=todayISO();
  const finalDays = days.filter(d=>{ const p=dayplanFor(d); return p && p.final && p.rows.some(r=>r.empId===e.id); });
  const upcoming = Object.values(S.leave).filter(l=>l.empId===e.id && l.status==='goedgekeurd' && l.to>=t).sort((a,b)=>a.from<b.from?-1:1);
  return `<div class="topbar"><div><div class="eyebrow">Hallo ${esc(e.name.split(' ')[0])}</div><h2>Mijn rooster</h2></div>
    <div class="toolbar">${renderWeekNav(V.myWeek,'my')}</div></div>
  <div class="mydays">${days.map(d=>{
    const dd=parseISO(d); const lv=leaveOn(e.id,d); const tid=getShift(e.id,d); const ty=tid?typeById(tid):null;
    const p=dayplanFor(d); const row=p&&p.final?p.rows.find(r=>r.empId===e.id):null; const bus=row&&busById(row.busId);
    const av = !lv && !ty && !e.fixed && weekAvail(e.id,d);
    return `<div class="myday ${d===t?'today':''}">
      <div class="dn"><b>${WEEKDAYS[wdIndex(dd)]}</b><span>${fmtShort(dd)}</span></div>
      ${lv?`<div class="what" style="color:var(--c-verlof)">Verlof</div>`: ty?`<div class="what t" style="${typeStyle(ty)}">${esc(ty.name)}</div>`: av?`<div class="what none">Beschikbaar, nog niet ingepland</div>`:`<div class="what none">Niet ingepland</div>`}
      ${ty && !lv ? (row ? `<div class="busline">${busIcon()} ${rowBus(row)?esc(rowBus(row)):'Geen bus'}${row.note?`<span class="muted" style="font-weight:500"> · ${esc(row.note)}</span>`:''}</div>` : `<div class="busline pending">Bus volgt in de dagplanning</div>`) : ''}
    </div>`; }).join('')}</div>
  ${finalDays.length?`<div class="panel" style="margin-top:14px"><h3>Definitieve dagplanning</h3><div class="stack">${finalDays.map(d=>`<details><summary style="cursor:pointer;font-weight:600;text-transform:capitalize">${fmtLong(parseISO(d))}</summary><pre class="export" style="margin-top:8px">${esc(exportText(d))}</pre></details>`).join('')}</div></div>`:''}

}
function busIcon(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11l4 4h3v6h-2"/><path d="M3 7v10h2"/><circle cx="8" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M10 17h5"/></svg>`; }

/* ============================== Events ============================== */
document.addEventListener('submit', async ev=>{
  if(ev.target.id==='loginForm'){
    ev.preventDefault(); const f=new FormData(ev.target); const u=f.get('user'), pw=f.get('pw'); const st=settings();
    const err = m => { document.getElementById('loginErr').textContent=m; };
    if(u===PLANNER_USER){
      if(!(await checkPassword(PLANNER_USER,pw))) return err('Onjuist wachtwoord.');
      session={role:'planner'};
    } else {
      const e=empById(u); if(!e) return err('Medewerker niet gevonden.');
      if(!e.pwHash){
        if(pw!==st.employeePassword) return err('Onjuist startwachtwoord. Vraag het aan de planner.');
        V.login={stage:'setpw',empId:u}; render(); return;
      }
      if(!(await checkPassword(u,pw))) return err('Onjuist wachtwoord.');
      session={role:'employee',empId:u};
    }
    V.login=null; saveSession(); V.page = session.role==='planner'?'rooster':'mijn'; render();
  }
  if(ev.target.id==='setPwForm'){
    ev.preventDefault(); const f=new FormData(ev.target); const p1=f.get('pw1'), p2=f.get('pw2');
    const err = m => { document.getElementById('setPwErr').textContent=m; };
    if(p1.length<6) return err('Minimaal 6 tekens.'); if(p1!==p2) return err('De wachtwoorden zijn niet gelijk.');
    const st=clone(settings()); const e=st.employees.find(x=>x.id===V.login.empId); if(!e) return err('Medewerker niet gevonden.');
    e.pwHash = await hashPw(e.id,p1); await writeDoc('settings','main',st);
    session={role:'employee',empId:e.id}; V.login=null; saveSession(); V.page='mijn'; render(); toast('Wachtwoord ingesteld');
  }
  if(ev.target.id==='changePwForm'){
    ev.preventDefault(); const f=new FormData(ev.target); const old=f.get('old'), p1=f.get('pw1'), p2=f.get('pw2');
    const err = m => { document.getElementById('changePwErr').textContent=m; };
    const who = session.role==='planner' ? PLANNER_USER : session.empId;
    if(!(await checkPassword(who,old))) return err('Het huidige wachtwoord klopt niet.');
    if(p1.length<6) return err('Minimaal 6 tekens.'); if(p1!==p2) return err('De nieuwe wachtwoorden zijn niet gelijk.');
    const st=clone(settings());
    if(who===PLANNER_USER){ st.plannerPwHash = await hashPw('planner',p1); delete st.plannerPassword; }
    else { const e=st.employees.find(x=>x.id===who); if(!e) return err('Medewerker niet gevonden.'); e.pwHash = await hashPw(e.id,p1); }
    await writeDoc('settings','main',st); ev.target.reset(); toast('Wachtwoord gewijzigd');
  }
  if(ev.target.id==='leaveForm'){
    ev.preventDefault(); const f=new FormData(ev.target); const from=f.get('from'), to=f.get('to');
    if(!from||!to||to<from){ document.getElementById('leaveErr').textContent='De einddatum ligt vóór de begindatum.'; return; }
    const id=uid(); await writeDoc('leave',id,{id,empId:session.empId,from,to,reason:(f.get('reason')||'').trim(),status:'open',createdAt:new Date().toISOString()});
    toast('Aanvraag verstuurd');
  }
});

document.addEventListener('click', async ev=>{
  const b = ev.target.closest('button,[data-cell]');
  if(V.menu && !ev.target.closest('#menu') && !(b && b.dataset.cell)){ V.menu=null; render(); }
  if(!b) return;
  const ds = b.dataset;
  if(V.confirm && !(ds.typeDel!==undefined || ds.empDel!==undefined)){ V.confirm=null; }
  if(ds.nav){ V.page=ds.nav; V.menu=null; render(); return; }
  if('logout' in ds){ session=null; saveSession(); render(); return; }
  if(ds.wk){ const cur = ds.wk==='my'?V.myWeek:V.weekStart; const n = ds.delta==='0' ? iso(monday(new Date())) : iso(addDays(parseISO(cur),Number(ds.delta))); if(ds.wk==='my') V.myWeek=n; else V.weekStart=n; render(); return; }
  if(ds.cell){ const [empId,date]=ds.cell.split('|'); const r=b.getBoundingClientRect(); V.menu={empId,date,x:r.left,y:r.bottom+4}; render(); return; }
  if(ds.pick!==undefined){ const m=V.menu; V.menu=null; await setShift(m.empId,m.date,ds.pick||null); return; }
  if(ds.avail!==undefined && V.menu){ const m=V.menu; V.menu=null; await setAvail(m.empId,m.date,ds.avail==='1'); return; }
  if(ds.day!==undefined){ V.planDate = ds.day==='0' ? todayISO() : iso(addDays(parseISO(V.planDate),Number(ds.day))); render(); return; }
  if('planAdd' in ds){ await updatePlan(p=>{ p.rows.push({empId:settings().employees[0].id,typeId:(settings().types[0]||{}).id||'',busId:'',note:''}); }); return; }
  if('planAdhoc' in ds){ await updatePlan(p=>{ p.rows.push({adhoc:true,empId:'',name:'',typeId:(settings().types[0]||{}).id||'',busId:'',note:''}); }); return; }
  if(ds.planOpen){ V.planDate=ds.planOpen; render(); window.scrollTo({top:0}); return; }
  if('planSync' in ds){ await updatePlan(p=>{ const have=new Set(p.rows.map(r=>r.empId)); rowsFromRoster(V.planDate).forEach(r=>{ if(!have.has(r.empId)) p.rows.push(r); }); }); toast('Aangevuld'); return; }
  if(ds.prowDel!==undefined){ await updatePlan(p=>{ p.rows.splice(Number(ds.prowDel),1); }); return; }
  if(ds.planFinal!==undefined){ await updatePlan(p=>{ p.final = ds.planFinal==='1'; }); toast(ds.planFinal==='1'?'Dagplanning is definitief':'Terug naar concept'); return; }
  if('copy' in ds){ copyText(exportText(V.planDate)); return; }
  if('share' in ds){ shareText(exportText(V.planDate),'Dagplanning '+fmtNL(V.planDate)); return; }
  if('dl' in ds){ downloadText(exportText(V.planDate),`dagplanning-${V.planDate}.txt`); return; }
  if(ds.ltab){ V.leaveTab=ds.ltab; render(); return; }
  if(ds.leave && ds.decide){ if(ds.decide==='open'){ const l=clone(S.leave[ds.leave]); l.status='open'; delete l.decidedAt; await writeDoc('leave',ds.leave,l); } else await decideLeave(ds.leave,ds.decide); return; }
  if(ds.leaveCancel){ await deleteDoc('leave',ds.leaveCancel); toast('Aanvraag ingetrokken'); return; }
  // instellingen
  const st = clone(settings());
  if('busAdd' in ds){ st.buses.push({id:'b'+uid(),name:''}); await writeDoc('settings','main',st); return; }
  if(ds.busDel!==undefined){ st.buses.splice(Number(ds.busDel),1); await writeDoc('settings','main',st); return; }
  if('typeAdd' in ds){ st.types.push({id:'t'+uid(),name:'Nieuwe route',short:'Route',color:COLORS[st.types.length%COLORS.length]}); await writeDoc('settings','main',st); return; }
  if(ds.typeDel!==undefined){ const key='type:'+ds.typeDel; if(V.confirm!==key){ V.confirm=key; render(); return; } V.confirm=null; st.types.splice(Number(ds.typeDel),1); await writeDoc('settings','main',st); return; }
  if(ds.type!==undefined && ds.color){ st.types[Number(ds.type)].color=ds.color; await writeDoc('settings','main',st); return; }
  if('empAdd' in ds){ st.employees.push(newEmp('Nieuwe medewerker','chauffeur')); await writeDoc('settings','main',st); return; }
  if(ds.empPwreset!==undefined){ const e=st.employees[Number(ds.empPwreset)]; delete e.pwHash; await writeDoc('settings','main',st); toast(`${e.name} logt de volgende keer in met het startwachtwoord`); return; }
  if('loginBack' in ds){ V.login=null; render(); return; }
  if(ds.empDel!==undefined){ const key='emp:'+ds.empDel; if(V.confirm!==key){ V.confirm=key; render(); return; } V.confirm=null; st.employees.splice(Number(ds.empDel),1); await writeDoc('settings','main',st); return; }
});

document.addEventListener('change', async ev=>{
  const el = ev.target; const ds = el.dataset;
  if(el.id==='lu'){ V.loginUser=el.value; render(); const s=document.getElementById('lp'); if(s) s.focus(); return; }
  if(ds.wkdate){ const d=parseISO(el.value); if(isNaN(d)) return; const n=iso(monday(d)); if(ds.wkdate==='my') V.myWeek=n; else V.weekStart=n; render(); return; }
  if(el.id==='planDate'){ const d=parseISO(el.value); if(!isNaN(d)){ V.planDate=el.value; render(); } return; }
  if(ds.prow!==undefined){ await updatePlan(p=>{ const r=p.rows[Number(ds.prow)];
    if(ds.pf==='empId' && el.value==='__adhoc'){ r.adhoc=true; r.empId=''; r.name=''; }
    else if(ds.pf==='empId'){ r.adhoc=false; r.empId=el.value; }
    else r[ds.pf]=ds.pf==='name'?el.value.trim():el.value; }); return; }
  const st = clone(settings());
  if(ds.need!==undefined){ st.needs[Number(ds.need)] = Math.max(0,Number(el.value)||0); await writeDoc('settings','main',st); return; }
  if(ds.bus!==undefined){ st.buses[Number(ds.bus)][ds.bf]=el.value.trim(); await writeDoc('settings','main',st); return; }
  if(ds.type!==undefined && ds.tf){ st.types[Number(ds.type)][ds.tf]=el.value.trim(); await writeDoc('settings','main',st); return; }
  if(ds.pw){ const v=el.value.trim(); if(!v){ toast('Wachtwoord mag niet leeg zijn'); render(); return; } st[ds.pw]=v; await writeDoc('settings','main',st); toast('Wachtwoord opgeslagen'); return; }
  if(ds.emp!==undefined){
    const e = st.employees[Number(ds.emp)];
    if(ds.avail!==undefined) e.avail[Number(ds.avail)] = el.checked?1:0;
    else if(ds.ef==='counts' || ds.ef==='fixed') e[ds.ef] = el.checked;
    else e[ds.ef] = el.value.trim();
    await writeDoc('settings','main',st); return;
  }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && V.menu){ V.menu=null; render(); } });

connect();
</script>
